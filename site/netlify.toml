# Netlify site: ifmexamprep.com  (Base directory: site)
[build]
  publish = "."
  # Skip deploys when nothing in site/ changed
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[[redirects]]
  from = "https://www.ifmexamprep.com/*"
  to = "https://ifmexamprep.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
